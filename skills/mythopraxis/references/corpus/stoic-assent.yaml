id: stoic-assent
title: Assent, action, and control
tradition: Greco-Roman Stoicism
entry_type: philosophical-lens
summary: Distinguish what can be chosen from what cannot, then direct effort toward judgment and action rather than imagined control over outcomes.
safe_use: Use to restore agency and calibration, not to demand emotional suppression or passive acceptance.
cultural_context: Drawn from a specific Hellenistic and Roman philosophical tradition with substantial internal diversity.
