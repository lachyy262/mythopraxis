id: daoist-non-forcing
title: Non-forcing and adaptive action
tradition: Classical Chinese Daoist thought
entry_type: philosophical-lens
summary: Ask whether forceful intervention is producing the resistance it seeks to overcome and whether a more responsive action would preserve the real aim.
safe_use: Use as a contextual question, not as a slogan for passivity or a generic idea detached from Daoist texts.
cultural_context: Informed by the Zhuangzi and a public-domain James Legge translation hosted with source context by the Chinese Text Project.
sources:
