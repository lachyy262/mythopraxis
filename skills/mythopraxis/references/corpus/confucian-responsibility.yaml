id: confucian-responsibility
title: Relational responsibility and fitting conduct
tradition: Classical Chinese Confucian thought
entry_type: philosophical-lens
summary: Consider how responsibilities arise through relationships and how fitting conduct can preserve both humane concern and dependable roles.
safe_use: Do not flatten relational ethics into hierarchy, obedience, or a universal rule detached from its tradition.
cultural_context: Informed by the Analects and presented as one historically situated lens among many Confucian interpretations.
sources:
  - title: The Analects
    creator: Traditional text, translated by James Legge
    url: https://ctext.org/analects/ens
    rights_status: public-domain translation
rights_status: public-domain
