id: aristotelian-balance
title: Practical wisdom between excesses
tradition: Ancient Greek Aristotelian ethics
entry_type: philosophical-lens
summary: Treat good judgment as context-sensitive practical reasoning in which a quality can fail through both excess and deficiency.
safe_use: Use paired qualities as a design prompt, not as a claim that every virtue is simple moderation.
cultural_context: Based on Aristotle's virtue ethics and its account of practical wisdom, choice, habit, and context.
sources:
  - title: Nicomachean Ethics
    creator: Aristotle, translated by W. D. Ross
    url: https://classics.mit.edu/Aristotle/nicomachaen.html
    rights_status: public-domain translation
rights_status: public-domain
review_status: reviewed
