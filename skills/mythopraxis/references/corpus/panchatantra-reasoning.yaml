id: panchatantra-reasoning
title: Practical judgment through nested consequence
tradition: Sanskrit Panchatantra tradition
entry_type: narrative-pattern
summary: Use interacting motives and consequences to rehearse practical judgment where a locally clever move can create a larger failure.
safe_use: Treat the Panchatantra as a specific Indian literary tradition and do not relabel its stories as generic folklore.
cultural_context: The Panchatantra has a long multilingual transmission history. This entry uses it only as a contextual narrative lens.
