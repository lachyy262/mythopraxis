name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.txt -e ".[dev,providers,audit]"
      - name: Test
        run: pytest
      - name: Validate repository contract
        run: mythopraxis validate .
      - name: Expand pilot without provider calls
        run: mythopraxis eval --matrix evals/matrix.yaml --dry-run
      - name: Audit pinned dependencies
        run: pip-audit --disable-pip --no-deps -r requirements-dev.txt
      - name: Scan Python source
        run: bandit -r src -q
