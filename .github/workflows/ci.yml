name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.txt -e ".[dev,providers,audit]"
      - name: Test
        run: pytest
      - name: Validate repository contract
        run: mythopraxis validate .
      - name: Expand pilot without provider calls
        run: mythopraxis eval --matrix evals/matrix.yaml --dry-run
      - name: Audit pinned dependencies
        run: pip-audit --disable-pip --no-deps -r requirements-dev.txt
      - name: Scan Python source
        run: bandit -r src -q
